[package]
name = "geo-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Jojin John <jojinn1709@gmail.com>"]
description = "High-performance Rust WebAssembly geospatial algorithms for Map Atlas"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
